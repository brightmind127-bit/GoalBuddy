name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GoalBuddy.apk

      - name: Save APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalBuddy-apk
          path: GoalBuddy.apk

      - name: Publish a Release with the APK (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Goal Buddy build ${{ github.run_number }}
          body: Download GoalBuddy.apk below on your Android phone or tablet and open it to install.
          files: GoalBuddy.apk
